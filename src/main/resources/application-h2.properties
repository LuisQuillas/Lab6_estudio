# Perfil para probar el proyecto SIN MySQL instalado (solo para desarrollo/demo).
# Ejecutar con: mvn spring-boot:run -Dspring-boot.run.profiles=h2
spring.datasource.url=jdbc:h2:mem:cacatua;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql
spring.sql.init.data-locations=classpath:data-h2.sql

server.port=8080
